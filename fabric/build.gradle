plugins { id 'com.gradleup.shadow' }

architectury { platformSetupLoomIde(); fabric() }

configurations {
	common
	shadowCommon
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentFabric.extendsFrom common
}

dependencies {
	modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"
	modCompileOnly "dev.architectury:architectury-fabric:${rootProject.architectury_version}"
	modLocalRuntime "dev.architectury:architectury-fabric:${rootProject.architectury_runtime_version}"
	modImplementation "maven.modrinth:modmenu:${rootProject.modmenu_version}"
	modImplementation "dev.isxander:yet-another-config-lib:${rootProject.yacl_version}-fabric"
	common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
	shadowCommon(project(path: ':common', configuration: 'transformProductionFabric')) { transitive = false }
}

processResources {
	inputs.property 'version', project.version

	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

shadowJar {
	exclude 'architectury.common.json'
	configurations = [project.configurations.shadowCommon]
	archiveClassifier = 'dev-shadow'
}

remapJar {
	input.set shadowJar.archiveFile
	dependsOn shadowJar
	archiveClassifier = null
}

jar {
	from(rootProject.file('LICENSE')) {
		rename { "${it}_${rootProject.archives_base_name}" }
	}
}
