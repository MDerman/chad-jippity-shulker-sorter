plugins {
	id 'architectury-plugin' version "${arch_plugin_version}"
	id 'dev.architectury.loom-remap' version "${arch_loom_version}" apply false
	id 'com.gradleup.shadow' version "${shadow_version}" apply false
}

architectury { minecraft = project.minecraft_version }

subprojects {
	apply plugin: 'dev.architectury.loom-remap'
	loom { silentMojangMappingsLicense() }
	dependencies {
		minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
		mappings loom.officialMojangMappings()
	}
}

allprojects {
	apply plugin: 'java'
	apply plugin: 'architectury-plugin'
	version = "${rootProject.mod_version}+mc${rootProject.minecraft_range}"
	group = rootProject.maven_group
	base { archivesName = "${rootProject.archives_base_name}-${project.name}" }
	repositories {
		maven { name = 'Architectury'; url = 'https://maven.architectury.dev/' }
		maven { name = 'Xander'; url = 'https://maven.isxander.dev/releases' }
		maven { name = 'KotlinForForge'; url = 'https://thedarkcolour.github.io/KotlinForForge/' }
		maven {
			name = 'Modrinth'
			url = 'https://api.modrinth.com/maven'
			content { includeGroup 'maven.modrinth' }
		}
	}
	tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
	java { withSourcesJar() }
}
