# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache
org.gradle.configuration-cache=false

# Minecraft
# Compatible with Minecraft 1.21.9 through 1.21.11
minecraft_version=1.21.11
# Supported MC range (jar name: <mod>-<loader>-<version>+mc<range>.jar)
minecraft_range=1.21.9-1.21.11

# Build plugins (Architectury template; dev.architectury.loom-remap for 1.21.9+)
arch_plugin_version=3.5.168
arch_loom_version=1.14.476
shadow_version=9.5.1

# Fabric
loader_version=0.18.3
fabric_version=0.140.0+1.21.11

# Mod Properties
mod_version=1.0.0
maven_group=dev.matthewderman.aishulkersorter
archives_base_name=aishulkersorter

# Dependencies
# Pinned to 18.0.3: the oldest Architectury for this MC range (18.x = 1.21.9/1.21.10,
# 19.x = 1.21.11 only). Compiling against it guarantees we only use API present in all.
architectury_version=18.0.3
architectury_runtime_version=19.0.1
modmenu_version=17.0.0
yacl_version=3.8.2+1.21.11
